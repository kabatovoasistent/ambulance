<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anamnéza TČM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF2EE;--surface:#FFFFFF;--ink:#1B2A24;--muted:#6C7C74;
--line:#D4DED7;--jade:#2F6B57;--jade-soft:#DFEAE3;--clay:#9C5F35;--r:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Inter Tight",-apple-system,"Segoe UI",Roboto,sans-serif;
font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:"Newsreader",Georgia,serif;font-size:21px;margin:0 0 2px}
.brand-sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.mode-pill{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--jade-soft);color:var(--jade);margin:0 0 18px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;font-size:14.5px}
.nav-item:hover{background:var(--paper)}
.nav-item[aria-current="true"]{background:var(--jade-soft);color:var(--jade);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.nav-item[data-done="true"] .dot{background:var(--jade)}
.main{padding:26px 30px 130px;max-width:800px}
.topbar{display:none}
h2.sec-title{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:27px;margin:0 0 4px}
.sec-hint{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.q{padding:15px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q.detail{border-top:0;padding:6px 0 6px 14px;border-left:2px solid var(--jade-soft)}
.q-text{font-weight:500;margin:0 0 9px}
.q.detail .q-text{font-weight:400;color:var(--muted);font-size:15px}
.q-last{color:var(--muted);font-size:13.5px;margin:7px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:15px;min-height:42px}
.chip:hover{border-color:var(--jade)}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff}
.chip.neg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.matice{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mbtns{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.mbtns button{border:0;background:none;padding:7px 11px;font-size:13.5px;min-height:38px;white-space:nowrap}
.mbtns button+button{border-left:1px solid var(--line)}
.mbtns button[aria-pressed="true"]{background:var(--jade);color:#fff}
.mbtns button[data-v="ne"][aria-pressed="true"]{background:var(--ink)}
.scale{display:flex;align-items:center;gap:14px}
.scale input{flex:1;accent-color:var(--jade)}
.scale output{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px}
.scale-legend{color:var(--muted);font-size:13px;margin:6px 0 0}
.num{display:flex;align-items:center;gap:9px}
.num input{width:110px;text-align:center;font-variant-numeric:tabular-nums}
.unit{color:var(--muted)}
.calc{color:var(--jade);font-size:14px;margin:8px 0 0}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 13px;font:inherit;resize:vertical}
.note-toggle{background:none;border:0;color:var(--muted);font-size:13.5px;padding:6px 0;text-decoration:underline}
.q-note{margin-top:8px}
.bbc{display:flex;flex-direction:column;gap:8px}
.bbcrow{display:flex;gap:8px;align-items:center}
.bbcrow input[type=text]{flex:1}
.bbcnum{width:82px;text-align:center}
.bbcsel{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font:inherit}
.bbcdel{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:42px;min-height:42px;color:var(--muted)}
.mrizka{width:100%;border-collapse:collapse;font-size:14.5px}
.mrizka th,.mrizka td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mrizka th:first-child,.mrizka td:first-child{text-align:left}
.mrizka td.el{font-weight:600}
.mrizka small{color:var(--muted);font-weight:400}
.shoda-ok{color:var(--jade)}.shoda-ne{color:var(--clay)}
.zatez{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sec-actions{display:flex;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font-size:15px}
.btn:hover{border-color:var(--jade)}
.btn-primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn-primary:hover{background:#26584a}
.footbar{position:fixed;left:252px;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 30px;display:flex;gap:10px;align-items:center}
.progress{flex:1;height:6px;background:var(--paper);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);width:0;transition:width .25s}
.count{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.record{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.record h3{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:20px;margin:0 0 12px}
#zapisText{font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.65;min-height:460px;border:0;padding:0;background:none}
#zapisText:focus{outline:none}
.el{padding:10px 0;border-top:1px solid var(--line)}
.el:first-of-type{border-top:0}
.el-head{display:flex;align-items:baseline;gap:10px}
.el-name{font-weight:600}
.el-pct{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;margin-left:auto}
.bar{height:6px;background:var(--paper);border-radius:99px;margin:7px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--clay)}
.bar.loc i{background:var(--jade)}
.why{color:var(--muted);font-size:13.5px;margin:0}
.disclaimer{color:var(--muted);font-size:13.5px;margin:14px 0 0}
.empty{color:var(--muted)}
.vzorec{font-family:"Newsreader",Georgia,serif;font-size:19px;margin:0 0 6px}
table.trend{width:100%;border-collapse:collapse;font-size:14.5px}
table.trend th,table.trend td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.trend th:first-child,table.trend td:first-child{text-align:left}
.up{color:var(--clay);font-weight:600}.down{color:var(--jade);font-weight:600}
.obraz{font-size:14.5px}
.obraz div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.obraz b{font-weight:500;flex:1}
.obraz span{color:var(--muted);white-space:nowrap}
.stale{color:var(--clay)}
@media (max-width:860px){
.app{grid-template-columns:1fr}.rail{display:none}
.topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:11px 16px}
.topbar .brand{font-size:17px;margin:0}
.sheet{position:fixed;inset:0;background:rgba(20,32,27,.35);z-index:20;display:none}
.sheet[data-open="true"]{display:block}
.sheet-inner{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 14px 26px;max-height:78vh;overflow:auto}
.main{padding:18px 16px 116px}h2.sec-title{font-size:23px}
.footbar{left:0;padding:10px 16px}.chip{font-size:15.5px;padding:11px 16px}
.mrow{grid-template-columns:1fr;gap:6px}.mbtns{width:100%}.mbtns button{flex:1}
table.trend{font-size:13px}table.trend th,table.trend td{padding:5px 4px}}
@media print{.rail,.footbar,.topbar,.sec-actions{display:none}body{background:#fff}.main{padding:0;max-width:none}.record{border:0;padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <p class="brand">Anamnéza TČM</p>
    <p class="brand-sub" id="klientInfo">Nový odběr</p>
    <p class="mode-pill" id="modePill">Vstupní odběr</p>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div>
    <header class="topbar">
      <button class="btn" id="openSheet" style="padding:8px 12px;min-height:40px">Sekce</button>
      <p class="brand" id="topTitle">Anamnéza TČM</p>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="footbar">
  <button class="btn" id="prevBtn">Zpět</button>
  <div class="progress"><i id="progressBar"></i></div>
  <span class="count" id="countLabel"></span>
  <button class="btn btn-primary" id="nextBtn">Další</button>
</div>
<div class="sheet" id="sheet"><div class="sheet-inner"><nav class="nav" id="navMobile"></nav></div></div>

<script>
/* ===================================================================
   SYNDROMOVÉ ELEMENTY
   povaha = jaká je porucha, lokalizace = kde sídlí.
   Skóre se počítá vždy znovu z odpovědí a nikdy se neukládá.
   =================================================================== */
const POVAHA={
 qi_xu:{n:'Nedostatek Qi',sab:'Nedostatek Qi %g'},
 yang_xu:{n:'Nedostatek Yangu',sab:'Nedostatek Yangu %g'},
 yin_xu:{n:'Nedostatek Yinu',sab:'Nedostatek Yinu %g'},
 xue_xu:{n:'Nedostatek krve',sab:'Nedostatek krve %g'},
 qi_zhi:{n:'Stagnace Qi',sab:'Stagnace Qi %g'},
 xue_yu:{n:'Stáza krve',sab:'Stáza krve'},
 tan:{n:'Vlhkost a hlen',sab:'Vlhkost a hlen zatěžující %a'},
 re:{n:'Horko',sab:'Horko v %l'},
 han:{n:'Chlad',sab:'Chlad v %l'}
};
const LOKALIZACE={
 pi:{n:'Slezina',g:'sleziny',l:'slezině',a:'slezinu'},
 wei:{n:'Žaludek',g:'žaludku',l:'žaludku',a:'žaludek'},
 gan:{n:'Játra',g:'jater',l:'játrech',a:'játra'},
 shen:{n:'Ledviny',g:'ledvin',l:'ledvinách',a:'ledviny'},
 fei:{n:'Plíce',g:'plic',l:'plicích',a:'plíce'},
 xin:{n:'Srdce',g:'srdce',l:'srdci',a:'srdce'}
};
const ELEMENTY={
 drevo:{n:'Dřevo',org:'játra, žlučník, oči, šlachy'},
 ohen:{n:'Oheň',org:'srdce, tenké střevo, cévy'},
 zeme:{n:'Země',org:'slezina, žaludek, svaly'},
 kov:{n:'Kov',org:'plíce, tlusté střevo, kůže'},
 voda:{n:'Voda',org:'ledviny, měchýř, kosti'}
};
const LOK2EL={gan:'drevo',xin:'ohen',pi:'zeme',wei:'zeme',fei:'kov',shen:'voda'};
const OSY={
 oslabeni:{n:'Oslabení',pov:['qi_xu','yang_xu','yin_xu','xue_xu']},
 stagnace:{n:'Stagnace',pov:['qi_zhi','xue_yu','tan']},
 teplo:{n:'Teplo a chlad',pov:['re','han'],znamenko:{re:1,han:-1}}
};
const MAPA_ORGANU={'játra':'drevo','žlučník':'drevo','oči':'drevo','šlachy':'drevo','zrak':'drevo',
 'srdce':'ohen','tenké střevo':'ohen','osrdečník':'ohen','cévy':'ohen','oběh':'ohen','štítná žláza':'ohen',
 'slezina':'zeme','žaludek':'zeme','slinivka':'zeme','svaly':'zeme','ústa':'zeme','lymfa':'zeme','trávení':'zeme',
 'plíce':'kov','tlusté střevo':'kov','kůže':'kov','nos':'kov','průdušky':'kov','střevo':'kov',
 'ledviny':'voda','močový měchýř':'voda','měchýř':'voda','kosti':'voda','uši':'voda','nadledviny':'voda',
 'prostata':'voda','děloha':'voda','vaječníky':'voda','páteř':'voda','mozek':'voda','zuby':'voda'};
function organNaElement(n){
  const t=(n||'').toLowerCase().trim();
  if(MAPA_ORGANU[t])return MAPA_ORGANU[t];
  const k=Object.keys(MAPA_ORGANU).filter(x=>t.indexOf(x)>=0)[0];
  return k?MAPA_ORGANU[k]:'';
}
const FREK=[{l:'ne',w:0},{l:'výjimečně',w:.25},{l:'občas',w:.5},{l:'často',w:1}];
const PULS_KOEF=0.6;
const PRAH_PRITOMEN=20,PRAH_VYRAZNY=45;
const MIN_PODKLAD=5; // méně než tolik váhy = příliš tenký podklad, buňka se nevyhodnocuje
// s kterými lokalizacemi dává povaha klinicky smysl (pořadí nerozhoduje)
const AFINITA={qi_xu:['pi','fei','xin','shen'],yang_xu:['shen','pi'],yin_xu:['shen','fei','xin'],
 xue_xu:['gan','xin','pi'],qi_zhi:['gan'],xue_yu:[],tan:['pi','fei'],
 re:['gan','wei','xin','fei'],han:['pi','shen']};

/* ===================================================================
   DOTAZNÍK   s:1 = pevná sada pro kontrolu   t:{} = váhy k elementům
   =================================================================== */
const DOTAZNIK=[

{id:'zaklad',nazev:'Základní údaje',hint:'Rámec návštěvy a osobní anamnéza.',vzdy:1,otazky:[
 {id:'klient',typ:'text',text:'Označení klienta (iniciály nebo ID, ne celé jméno)',zapis:'Klient',s:1},
 {id:'typ_navstevy',typ:'vyber',text:'Důvod návštěvy',zapis:'Důvod návštěvy',s:1,volby:[{l:'prevence'},{l:'konkrétní potíž'}]},
 {id:'pohlavi',typ:'vyber',text:'Pohlaví',zapis:'Pohlaví',s:1,volby:[{l:'žena'},{l:'muž'}]},
 {id:'vek',typ:'cislo',text:'Věk',jednotka:'let',zapis:'Věk'},
 {id:'potize',typ:'text',text:'Současné potíže vlastními slovy',zapis:'Současné potíže',podminka:a=>a.typ_navstevy==='konkrétní potíž'},
 {id:'potize_trvani',typ:'vyber',text:'Doba trvání',zapis:'Trvání',detail:1,podminka:a=>a.typ_navstevy==='konkrétní potíž',volby:[{l:'dny'},{l:'týdny'},{l:'měsíce'},{l:'roky'}]},
 {id:'spoustec',typ:'vicevyber',text:'Spouštěcí faktor',zapis:'Spouštěč',detail:1,podminka:a=>a.typ_navstevy==='konkrétní potíž',volby:[
   {l:'neznámý'},{l:'stres',t:{qi_zhi:2,gan:1}},{l:'úraz',t:{xue_yu:2}},{l:'infekce'},
   {l:'prochlazení',t:{han:2,yang_xu:1}},{l:'chyba ve stravě',t:{pi:2}},{l:'přepracování',t:{qi_xu:2}}]},
 {id:'zhorsuje',typ:'vicevyber',text:'Co potíže zhoršuje',zapis:'Zhoršuje',detail:1,podminka:a=>a.typ_navstevy==='konkrétní potíž',volby:[
   {l:'chlad',t:{han:3,yang_xu:1}},{l:'teplo',t:{re:3}},{l:'vlhko',t:{tan:3}},{l:'stres',t:{qi_zhi:3,gan:1}},
   {l:'námaha',t:{qi_xu:3}},{l:'klid',t:{xue_yu:1,qi_zhi:1}},{l:'jídlo',t:{pi:2}},{l:'ráno'},
   {l:'večer',t:{yin_xu:1}},{l:'noc',t:{xue_yu:1,yin_xu:1}}]},
 {id:'zlepsuje',typ:'vicevyber',text:'Co potíže zlepšuje',zapis:'Zlepšuje',detail:1,podminka:a=>a.typ_navstevy==='konkrétní potíž',volby:[
   {l:'teplo',t:{han:3,yang_xu:2}},{l:'chlad',t:{re:2}},{l:'klid',t:{qi_xu:2}},{l:'pohyb',t:{qi_zhi:3}},
   {l:'jídlo',t:{qi_xu:1,pi:1}},{l:'spánek'},{l:'tlak a masáž',t:{qi_xu:2}}]},
 {id:'detstvi',typ:'vicevyber',text:'Choroby v dětství',zapis:'Dětství',volby:[
   {l:'nic závažného'},{l:'běžné dětské nemoci'},{l:'časté angíny',t:{fei:2,re:1}},{l:'opakované záněty uší'},
   {l:'bronchitidy',t:{fei:2,tan:1}},{l:'astma',t:{fei:3,tan:1}},{l:'ekzém',t:{re:1,tan:1}}]},
 {id:'atb_detstvi',typ:'anone',text:'Časté antibiotikum v dětství',zapis:'časté ATB v dětství',t:{qi_xu:2,pi:2}},
 {id:'atb_detstvi_co',typ:'text',text:'Jaké a proč',zapis:'ATB v dětství',detail:1,podminka:a=>a.atb_detstvi==='ano'},
 {id:'dospelost',typ:'text',text:'Závažné nebo časté choroby v dospělosti',zapis:'Dospělost'}
]},

{id:'vysledek',nazev:'Sledované potíže',hint:'Klient si pojmenuje, co ho trápí. Při každé kontrole se hodnotí totéž znovu.',vzdy:1,otazky:[
 {id:'pot1',typ:'text',text:'Potíž 1 — vlastními slovy klienta',zapis:'Potíž 1',s:1},
 {id:'pot1_s',typ:'skala6',text:'Jak silná byla potíž 1 za poslední týden',zapis:'Potíž 1 — skóre',s:1,detail:1},
 {id:'pot2',typ:'text',text:'Potíž 2 — vlastními slovy klienta',zapis:'Potíž 2',s:1},
 {id:'pot2_s',typ:'skala6',text:'Jak silná byla potíž 2 za poslední týden',zapis:'Potíž 2 — skóre',s:1,detail:1},
 {id:'cinnost',typ:'text',text:'Běžná činnost, kterou to omezuje',zapis:'Omezená činnost',s:1},
 {id:'cinnost_s',typ:'skala6',text:'Jak moc byla omezená za poslední týden',zapis:'Omezení činnosti',s:1,detail:1},
 {id:'pohoda',typ:'skala6',text:'Celková pohoda za poslední týden',zapis:'Celková pohoda',s:1},
 {id:'novy_priznak',typ:'text',text:'Nový příznak, který se objevil od minule',zapis:'Nový příznak',s:1}
]},

{id:'styl',nazev:'Životní styl',hint:'Operace, návyky, zátěž, farmakoterapie.',otazky:[
 {id:'atb5',typ:'anone',text:'Antibiotikum za posledních 5 let',zapis:'ATB v posledních 5 letech',t:{qi_xu:1,pi:1}},
 {id:'atb5_duvod',typ:'text',text:'Důvod užívání',zapis:'Důvod ATB',detail:1,podminka:a=>a.atb5==='ano'},
 {id:'operace',typ:'anone',text:'Prodělané operace',zapis:'operace v anamnéze',t:{xue_yu:1}},
 {id:'operace_co',typ:'text',text:'Jaké a kdy',zapis:'Operace',detail:1,podminka:a=>a.operace==='ano'},
 {id:'alergie',typ:'anone',text:'Alergie',zapis:'alergie',t:{fei:1}},
 {id:'alergie_co',typ:'text',text:'Na co a jak se projevuje',zapis:'Alergie',detail:1,podminka:a=>a.alergie==='ano'},
 {id:'koureni',typ:'vyber',text:'Kouření',zapis:'Kouření',volby:[{l:'nekuřák'},{l:'bývalý kuřák'},{l:'kuřák',t:{tan:2,re:1,fei:2}}]},
 {id:'koureni_pocet',typ:'cislo',text:'Cigaret denně',jednotka:'ks',zapis:'Cigaret denně',detail:1,podminka:a=>a.koureni==='kuřák'},
 {id:'koureni_konec',typ:'text',text:'Kdy přestal a jak silný kuřák byl',zapis:'Kouření v minulosti',detail:1,podminka:a=>a.koureni==='bývalý kuřák'},
 {id:'alkohol',typ:'vyber',text:'Alkohol',zapis:'Alkohol',volby:[{l:'ne'},{l:'příležitostně'},{l:'1–2× týdně'},{l:'denně',t:{re:3,tan:2}}]},

  odpovedi=d.odpovedi||{};poznamky=d.poznamky||{};rezim=d.rezim||'vstup';rozsireno=d.rozsireno||{};}}catch(e){}

const vsechnyOtazky=()=>DOTAZNIK.reduce((a,s)=>a.concat(s.otazky),[]);
const sekce=()=>DOTAZNIK.filter(s=>!s.podminka||s.podminka(odpovedi));
function viditelna(s,q){
  if(q.podminka&&!q.podminka(odpovedi))return false;
  if(rezim==='vstup')return q.id!=='novy_priznak';
  return !!(q.s||s.vzdy||rozsireno[s.id]);
}
const otazky=s=>s.otazky.filter(q=>viditelna(s,q));
function zodpovezeno(q){
  const v=odpovedi[q.id];
  if(q.typ==='matice')return !!(v&&Object.keys(v).length);
  if(v===undefined||v===null||v==='')return false;
  return Array.isArray(v)?v.length>0:true;
}

function dnesnyDatum(){return new Date().toISOString().slice(0,10);}
function czDatum(s){const p=s.split('-');return (+p[2])+'. '+(+p[1])+'. '+p[0];}
function stariDnu(s){return Math.round((Date.now()-new Date(s+'T00:00:00').getTime())/86400000);}
function prazdna(v){return v===''||v===undefined||v===null||(Array.isArray(v)&&!v.length);}

function obrazDo(index){
  const o={};
  historie.slice(0,index+1).forEach(od=>{
    Object.keys(od.odpovedi||{}).forEach(k=>{
      const v=od.odpovedi[k];
      if(prazdna(v))return;
      o[k]={v:v,datum:od.datum};
    });
  });
  return o;
}
function obrazAktualni(){
  const o=obrazDo(historie.length-1),d=dnesnyDatum();
  Object.keys(odpovedi).forEach(k=>{
    if(prazdna(odpovedi[k]))return;
    o[k]={v:odpovedi[k],datum:d};
  });
  return o;
}

/* ===================================================================
   SKÓRE ELEMENTŮ
   pct = dosažené váhy / dosažitelné váhy u zodpovězených otázek
   =================================================================== */
function skore(obraz){
  const raw={},max={},proc={};
  Object.keys(POVAHA).concat(Object.keys(LOKALIZACE)).forEach(k=>{raw[k]=0;max[k]=0;proc[k]=[];});
  let pocet=0,pocetDnes=0;
  const dnes=dnesnyDatum();

  const pripis=(t,podil,popis,koef)=>{
    if(!t)return false;
    Object.keys(t).forEach(k=>{
      if(raw[k]===undefined)return;
      const w=t[k];
      max[k]+=w*koef;
      if(podil>0){raw[k]+=w*podil*koef;proc[k].push(popis);}
    });
    return true;
  };

  vsechnyOtazky().forEach(q=>{
    const zaz=obraz[q.id];if(!zaz)return;
    const v=zaz.v,koef=q.puls?PULS_KOEF:1;
    let prispel=false;

    if(q.typ==='frek'&&q.t){
      const f=FREK.filter(x=>x.l===v)[0];if(!f)return;
      prispel=pripis(q.t,f.w,q.zapis+(f.w?' ('+v+')':''),koef);
    }else if(q.typ==='anone'&&q.t){
      prispel=pripis(q.t,v==='ano'?1:0,q.zapis,koef);
    }else if(q.typ==='skala'&&q.t){
      prispel=pripis(q.t,Number(v)/10,q.zapis+': '+v+'/10',koef);
    }else if(q.typ==='vyber'&&q.volby){
      const mx={};q.volby.forEach(o=>{if(o.t)Object.keys(o.t).forEach(k=>{mx[k]=Math.max(mx[k]||0,o.t[k]);});});
      if(Object.keys(mx).length){
        Object.keys(mx).forEach(k=>{if(max[k]!==undefined)max[k]+=mx[k]*koef;});
        const z=q.volby.filter(x=>x.l===v)[0];
        if(z&&z.t)Object.keys(z.t).forEach(k=>{
          if(raw[k]===undefined)return;raw[k]+=z.t[k]*koef;proc[k].push(q.zapis.toLowerCase()+': '+v);});
        prispel=true;
      }
    }else if(q.typ==='vicevyber'&&q.volby&&Array.isArray(v)){
      const mx={};q.volby.forEach(o=>{if(o.t)Object.keys(o.t).forEach(k=>{mx[k]=Math.max(mx[k]||0,o.t[k]);});});
      if(Object.keys(mx).length){
        Object.keys(mx).forEach(k=>{if(max[k]!==undefined)max[k]+=mx[k]*koef;});
        v.forEach(l=>{
          const o=q.volby.filter(x=>x.l===l)[0];
          if(o&&o.t)Object.keys(o.t).forEach(k=>{
            if(raw[k]===undefined)return;raw[k]+=o.t[k]*koef;proc[k].push(q.zapis.toLowerCase()+': '+l);});
        });
        prispel=true;
      }
    }else if(q.typ==='matice'&&q.polozky&&v&&typeof v==='object'){
      q.polozky.forEach(p=>{
        const x=v[p.id];if(!x)return;
        const f=FREK.filter(y=>y.l===x)[0];if(!f)return;
        pripis(p.t,f.w,p.l+(f.w?' ('+x+')':''),koef);
      });
      prispel=true;
    }
    if(prispel){pocet++;if(zaz.datum===dnes)pocetDnes++;}
  });

  const vysl=k=>({k:k,raw:Math.round(raw[k]*10)/10,max:Math.round(max[k]*10)/10,
    pct:max[k]>0?Math.round(raw[k]/max[k]*100):0,
    proc:proc[k].filter((x,i,a)=>a.indexOf(x)===i)});
  return {
    povaha:Object.keys(POVAHA).map(vysl).filter(x=>x.max>0).sort((a,b)=>b.pct-a.pct),
    lokalizace:Object.keys(LOKALIZACE).map(vysl).filter(x=>x.max>0).sort((a,b)=>b.pct-a.pct),
    pocet:pocet,pocetDnes:pocetDnes,pocetStarsi:pocet-pocetDnes
  };
}

function nazevVzorce(sk){
  if(!sk.povaha.length)return 'Bez dostatku dat';
  const top=sk.povaha[0].pct;
  const p=sk.povaha.filter(x=>x.pct>=PRAH_PRITOMEN&&x.pct>=top*0.7).slice(0,2);
  if(!p.length)return 'Bez výrazné převahy elementu';
  const locPct={};sk.lokalizace.forEach(x=>{locPct[x.k]=x.pct;});
  return p.map(x=>{
    const kand=(AFINITA[x.k]||[]).filter(k=>locPct[k]>=PRAH_PRITOMEN)
      .sort((a,b)=>locPct[b]-locPct[a]);
    if(!kand.length)return POVAHA[x.k].n;
    const L=LOKALIZACE[kand[0]];
    return POVAHA[x.k].sab.replace('%g',L.g).replace('%l',L.l).replace('%a',L.a);
  }).join(' + ');
}


/* ===================================================================
   MŘÍŽKA PĚTI ELEMENTŮ — tři osy, tři zdroje
   =================================================================== */
function bbcNorm(seznam,smer){
  const v=(seznam||[]).filter(r=>r&&r.n&&r.v!==''&&r.v!==undefined&&!isNaN(Number(r.v)));
  if(!v.length)return [];
  const c=v.map(r=>Number(r.v)),mn=Math.min.apply(null,c),mx=Math.max.apply(null,c);
  const absolutni=(mn>=0&&mx<=100);
  return v.map(r=>{
    const x=Number(r.v);let p;
    if(absolutni)p=smer==='primy'?x:100-x;
    else if(mx===mn)p=60;
    else p=smer==='primy'?(x-mn)/(mx-mn)*100:(mx-x)/(mx-mn)*100;
    return {n:r.n,e:r.e||organNaElement(r.n),v:x,pct:Math.round(p)};
  }).sort((a,b)=>b.pct-a.pct);
}
function bbcZObrazu(obraz){
  const g=id=>obraz[id]&&Array.isArray(obraz[id].v)?obraz[id].v:[];
  const d=id=>obraz[id]?obraz[id].datum:'';
  return {oslabeni:bbcNorm(g('bbc_oblasti'),'primy'),
          stagnace:bbcNorm(g('bbc_nerovnovahy'),'inverzni'),
          zateze:bbcNorm(g('bbc_zateze'),'inverzni'),
          datum:d('bbc_oblasti')||d('bbc_nerovnovahy')||d('bbc_zateze')};
}
function rozdel(t,podil,cil){
  const locs={};let sum=0;
  Object.keys(t).forEach(k=>{if(LOK2EL[k]){const e=LOK2EL[k];locs[e]=(locs[e]||0)+t[k];sum+=t[k];}});
  Object.keys(OSY).forEach(osa=>{
    let val=0;
    OSY[osa].pov.forEach(pk=>{
      if(t[pk]===undefined)return;
      const zn=OSY[osa].znamenko?OSY[osa].znamenko[pk]:1;
      val+=t[pk]*zn;
    });
    if(!val)return;
    if(sum>0)Object.keys(locs).forEach(e=>cil(e,osa,val*podil*(locs[e]/sum)));
    else cil('celkove',osa,val*podil);
  });
}
function prispevky(q,v){
  const out=[];
  if(q.typ==='frek'&&q.t){const f=FREK.filter(x=>x.l===v)[0];if(f)out.push({t:q.t,podil:f.w});}
  else if(q.typ==='anone'&&q.t)out.push({t:q.t,podil:v==='ano'?1:0});
  else if(q.typ==='skala'&&q.t)out.push({t:q.t,podil:Number(v)/10});
  else if(q.typ==='vyber'&&q.volby){const o=q.volby.filter(x=>x.l===v)[0];if(o&&o.t)out.push({t:o.t,podil:1});}
  else if(q.typ==='vicevyber'&&q.volby&&Array.isArray(v))v.forEach(l=>{
    const o=q.volby.filter(x=>x.l===l)[0];if(o&&o.t)out.push({t:o.t,podil:1});});
  else if(q.typ==='matice'&&q.polozky&&v&&typeof v==='object')q.polozky.forEach(pp=>{
    const x=v[pp.id];if(!x||!pp.t)return;const f=FREK.filter(y=>y.l===x)[0];if(f)out.push({t:pp.t,podil:f.w});});
  return out;
}
function osyZ(obraz,ids){
  const raw={},max={},kl=Object.keys(ELEMENTY).concat(['celkove']);
  kl.forEach(e=>{raw[e]={};max[e]={};Object.keys(OSY).forEach(o=>{raw[e][o]=0;max[e][o]=0;});});
  let pocet=0;
  DOTAZNIK.filter(s=>ids.indexOf(s.id)>=0).forEach(s=>s.otazky.forEach(q=>{
    const zaz=obraz[q.id];if(!zaz)return;
    const koef=q.puls?PULS_KOEF:1;
    prispevky(q,zaz.v).forEach(c=>rozdel(c.t,c.podil*koef,(e,o,x)=>{raw[e][o]+=x;}));
    let varianty=[];
    if(q.typ==='vyber'||q.typ==='vicevyber')varianty=(q.volby||[]).filter(o=>o.t).map(o=>o.t);
    else if(q.typ==='matice')varianty=(q.polozky||[]).map(pp=>pp.t).filter(Boolean);
    else if(q.t)varianty=[q.t];
    if(!varianty.length)return;
    if(q.typ==='matice')varianty.forEach(t=>rozdel(t,koef,(e,o,x)=>{max[e][o]+=Math.abs(x);}));
    else{
      const cell={};
      varianty.forEach(t=>rozdel(t,koef,(e,o,x)=>{const k=e+'|'+o;cell[k]=Math.max(cell[k]||0,Math.abs(x));}));
      Object.keys(cell).forEach(k=>{const pp=k.split('|');max[pp[0]][pp[1]]+=cell[k];});
    }
    pocet++;
  }));
  return {raw:raw,max:max,pocet:pocet};
}
const SEKCE_ANAMNEZA=['zaklad','styl','termo','bolesti','pohyb','traveni','spanek','smysly','dychani','kuze','gynuro','psychika'];
function mrizka(obraz){
  const anam=osyZ(obraz,SEKCE_ANAMNEZA),obj=osyZ(obraz,['objektiv']),bbc=bbcZObrazu(obraz);
  const pct=(src,e,o)=>src.max[e]&&src.max[e][o]>=MIN_PODKLAD?Math.round(src.raw[e][o]/src.max[e][o]*100):null;
  const bbcEl=(pole,e)=>{const f=pole.filter(x=>x.e===e);
    return f.length?Math.max.apply(null,f.map(x=>x.pct)):null;};
  const elementy=Object.keys(ELEMENTY).map(e=>{
    const b={};
    Object.keys(OSY).forEach(o=>{
      const a=pct(anam,e,o);
      const bb=o==='oslabeni'?bbcEl(bbc.oslabeni,e):(o==='stagnace'?bbcEl(bbc.stagnace,e):null);
      const j=pct(obj,e,o);
      const zd=[a,bb,j].filter(x=>x!==null);
      b[o]={anam:a,bbc:bb,obj:j,souhrn:zd.length?Math.round(zd.reduce((x,y)=>x+y,0)/zd.length):null};
    });
    const prum=k=>{const v=['oslabeni','stagnace'].map(o=>b[o][k]).filter(x=>x!==null);
      return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;};
    const zdroje={'anamnéza':prum('anam'),'BBC':prum('bbc'),'jazyk a oči':prum('obj')};
    const dost=Object.keys(zdroje).filter(k=>zdroje[k]!==null);
    let shoda='jeden zdroj',rozptyl=null;
    if(dost.length>=2){
      const hod=dost.map(k=>zdroje[k]);
      const hi=Math.max.apply(null,hod),lo=Math.min.apply(null,hod);
      rozptyl=Math.round(hi-lo);
      shoda=rozptyl<=30?'shoda':(dost.filter(k=>zdroje[k]===hi)[0]+' výš než '+dost.filter(k=>zdroje[k]===lo)[0]);
    }
    return {e:e,b:b,shoda:shoda,rozptyl:rozptyl,zdroje:zdroje,
      celkem:Math.max(b.oslabeni.souhrn||0,b.stagnace.souhrn||0)};
  });
  return {elementy:elementy,bbc:bbc,pocet:anam.pocet+obj.pocet,celkove:anam};
}
function souhrnText(m){
  const s=m.elementy.slice().sort((a,b)=>b.celkem-a.celkem).filter(x=>x.celkem>0);
  if(!s.length)return 'Zatím není dost dat.';
  return s.slice(0,2).map(x=>{
    const osa=(x.b.oslabeni.souhrn||0)>=(x.b.stagnace.souhrn||0)?'oslabení':'stagnace';
    const t=x.b.teplo.souhrn;
    const tep=t===null?'':(t>15?', s horkem':(t<-15?', s chladem':''));
    return ELEMENTY[x.e].n+' — '+osa+' '+x.celkem+tep;
  }).join('   |   ');
}

function renderNav(){
  const list=sekce();
  ['nav','navMobile'].forEach(id=>{
    const el=document.getElementById(id);el.innerHTML='';
    list.forEach((s,i)=>{
      const b=document.createElement('button');
      b.className='nav-item';b.setAttribute('aria-current',i===aktivni);
      b.dataset.done=(s.vystup||s.prubeh)?false:otazky(s).every(zodpovezeno);
      b.innerHTML='<span class="dot"></span>'+s.nazev;
      b.onclick=()=>{aktivni=i;document.getElementById('sheet').dataset.open='false';render();window.scrollTo(0,0);};
      el.appendChild(b);
    });
  });
  document.getElementById('modePill').textContent=rezim==='vstup'?'Vstupní odběr':'Kontrola č. '+(historie.length+1);
}

function chipRow(q,volby,multi){
  const box=document.createElement('div');box.className='chips';
  volby.forEach(o=>{
    const b=document.createElement('button');b.className='chip'+(o.l==='ne'?' neg':'');b.textContent=o.l;
    const akt=multi?(odpovedi[q.id]||[]).indexOf(o.l)>=0:odpovedi[q.id]===o.l;
    b.setAttribute('aria-pressed',akt);
    b.onclick=()=>{
      if(multi){const c=odpovedi[q.id]||[];odpovedi[q.id]=c.indexOf(o.l)>=0?c.filter(x=>x!==o.l):c.concat(o.l);}
      else odpovedi[q.id]=odpovedi[q.id]===o.l?'':o.l;
      uloz();render();
    };
    box.appendChild(b);
  });
  return box;
}

function minulaOdpoved(q){
  const o=obrazDo(historie.length-1)[q.id];
  if(!o)return null;
  let t=o.v;
  if(Array.isArray(t))t=t.join(', ');
  else if(t&&typeof t==='object')t=Object.keys(t).filter(k=>t[k]!=='ne')
    .map(k=>{const p=(q.polozky||[]).filter(y=>y.id===k)[0];return (p?p.l:k)+' ('+t[k]+')';}).join(', ')||'nic';
  return {t:t,datum:o.datum};
}

function renderOtazka(q){
  const w=document.createElement('div');w.className='q'+(q.detail?' detail':'');
  const t=document.createElement('p');t.className='q-text';t.textContent=q.text;w.appendChild(t);

  if(q.typ==='frek')w.appendChild(chipRow(q,FREK,false));
  if(q.typ==='anone')w.appendChild(chipRow(q,[{l:'ano'},{l:'ne'}],false));
  if(q.typ==='vyber')w.appendChild(chipRow(q,q.volby,false));
  if(q.typ==='vicevyber')w.appendChild(chipRow(q,q.volby,true));

  if(q.typ==='matice'){
    const box=document.createElement('div');box.className='matice';
    q.polozky.forEach(p=>{
      const row=document.createElement('div');row.className='mrow';
      const lab=document.createElement('span');lab.className='mrow-label';lab.textContent=p.l;
      const bt=document.createElement('div');bt.className='mbtns';
      FREK.forEach(f=>{
        const b=document.createElement('button');b.dataset.v=f.l;b.textContent=f.l;
        b.setAttribute('aria-pressed',(odpovedi[q.id]||{})[p.id]===f.l);
        b.onclick=()=>{const m={};const cur=odpovedi[q.id]||{};Object.keys(cur).forEach(k=>m[k]=cur[k]);
          m[p.id]=f.l;odpovedi[q.id]=m;uloz();render();};
        bt.appendChild(b);
      });
      row.appendChild(lab);row.appendChild(bt);box.appendChild(row);
    });
    w.appendChild(box);
  }

  if(q.typ==='skala'||q.typ==='skala6'){
    const mx=q.typ==='skala6'?6:10;
    const box=document.createElement('div');box.className='scale';
    const r=document.createElement('input');r.type='range';r.min=0;r.max=mx;r.step=1;
    r.value=odpovedi[q.id]===undefined?0:odpovedi[q.id];
    const o=document.createElement('output');o.textContent=(odpovedi[q.id]===undefined?0:odpovedi[q.id])+' / '+mx;
    r.oninput=()=>{o.textContent=r.value+' / '+mx;};
    r.onchange=()=>{odpovedi[q.id]=Number(r.value);uloz();renderNav();updateProgress();};
    box.appendChild(r);box.appendChild(o);w.appendChild(box);
    if(q.typ==='skala6'){
      const lg=document.createElement('p');lg.className='scale-legend';
      lg.textContent='0 = jak nejlépe může být, 6 = jak nejhůř může být';w.appendChild(lg);
    }
  }

  if(q.typ==='cislo'){
    const box=document.createElement('div');box.className='num';
    const i=document.createElement('input');i.type='number';i.inputMode='numeric';
    i.value=odpovedi[q.id]===undefined?'':odpovedi[q.id];
    const bmiEl=document.createElement('p');bmiEl.className='calc';
    i.oninput=()=>{odpovedi[q.id]=i.value===''?'':Number(i.value);uloz();
      if(q.bmi)bmiEl.textContent=bmiText();renderNav();updateProgress();};
    const u=document.createElement('span');u.className='unit';u.textContent=q.jednotka||'';
    box.appendChild(i);box.appendChild(u);w.appendChild(box);
    if(q.bmi){bmiEl.textContent=bmiText();w.appendChild(bmiEl);}
  }

  if(q.typ==='bbc'){
    if(q.napoveda){const nap=document.createElement('p');nap.className='scale-legend';
      nap.style.margin='0 0 10px';nap.textContent=q.napoveda;w.appendChild(nap);}
    const radky=odpovedi[q.id]||[];
    const box=document.createElement('div');box.className='bbc';
    radky.forEach((r,i)=>{
      const row=document.createElement('div');row.className='bbcrow';
      const nm=document.createElement('input');nm.type='text';nm.value=r.n||'';nm.placeholder='název';
      nm.oninput=()=>{r.n=nm.value;if(q.rezim==='el')r.e=r.e||organNaElement(nm.value);uloz();};
      nm.onblur=()=>render();
      const cis=document.createElement('input');cis.type='number';cis.className='bbcnum';
      cis.inputMode='numeric';cis.value=r.v===undefined?'':r.v;cis.placeholder='č.';
      cis.oninput=()=>{r.v=cis.value===''?'':Number(cis.value);uloz();};
      const del=document.createElement('button');del.className='bbcdel';del.textContent='×';
      del.title='Odebrat řádek';
      del.onclick=()=>{radky.splice(i,1);odpovedi[q.id]=radky;uloz();render();};
      row.appendChild(nm);row.appendChild(cis);
      if(q.rezim==='el'){
        const sel=document.createElement('select');sel.className='bbcsel';
        sel.innerHTML='<option value="">element…</option>'+
          Object.keys(ELEMENTY).map(k=>'<option value="'+k+'"'+(r.e===k?' selected':'')+'>'+ELEMENTY[k].n+'</option>').join('');
        sel.onchange=()=>{r.e=sel.value;uloz();render();};
        row.appendChild(sel);
      }
      row.appendChild(del);box.appendChild(row);
    });
    const pridej=document.createElement('button');pridej.className='btn';pridej.style.marginTop='10px';
    pridej.textContent='Přidat řádek';
    pridej.onclick=()=>{const r=(odpovedi[q.id]||[]).concat([{n:'',v:''}]);odpovedi[q.id]=r;uloz();render();};
    w.appendChild(box);w.appendChild(pridej);
  }

  if(q.typ==='text'){
    const ta=document.createElement('textarea');ta.rows=2;ta.value=odpovedi[q.id]||'';
    ta.oninput=()=>{odpovedi[q.id]=ta.value;uloz();};
    ta.onblur=()=>{renderNav();updateProgress();};
    w.appendChild(ta);
  }

  if(rezim==='kontrola'&&zodpovezeno(q)){
    const m=minulaOdpoved(q);
    if(m){const p=document.createElement('p');p.className='q-last';
      p.textContent='Minule ('+czDatum(m.datum)+'): '+m.t;w.appendChild(p);}
  }

  if(q.typ!=='text'){
    const tog=document.createElement('button');tog.className='note-toggle';
    tog.textContent=poznamky[q.id]?'Poznámka':'Přidat poznámku';
    const nd=document.createElement('div');nd.className='q-note';
    nd.style.display=poznamky[q.id]?'block':'none';
    const ta=document.createElement('textarea');ta.rows=2;ta.value=poznamky[q.id]||'';
    ta.oninput=()=>{poznamky[q.id]=ta.value;uloz();};
    nd.appendChild(ta);
    tog.onclick=()=>{nd.style.display=nd.style.display==='none'?'block':'none';if(nd.style.display==='block')ta.focus();};
    w.appendChild(tog);w.appendChild(nd);
  }
  return w;
}

function bmiText(){
  const hist=obrazDo(historie.length-1);
  const v=Number(odpovedi.vyska)||Number(hist.vyska?hist.vyska.v:0);
  const k=Number(odpovedi.vaha);
  if(!v||!k)return'';
  return 'BMI '+(k/Math.pow(v/100,2)).toFixed(1);
}

function render(){
  const list=sekce();
  if(aktivni>=list.length)aktivni=list.length-1;
  const s=list[aktivni],main=document.getElementById('main');
  main.innerHTML='';
  document.getElementById('topTitle').textContent=s.nazev;
  const h=document.createElement('h2');h.className='sec-title';h.textContent=s.nazev;
  const p=document.createElement('p');p.className='sec-hint';p.textContent=s.hint||'';
  main.appendChild(h);main.appendChild(p);

  if(s.vystup)renderZapis(main);
  else if(s.prubeh)renderPrubeh(main);
  else{
    otazky(s).forEach(q=>main.appendChild(renderOtazka(q)));
    const act=document.createElement('div');act.className='sec-actions';
    const b1=document.createElement('button');b1.className='btn';b1.textContent='Sekce bez potíží';
    b1.onclick=()=>{
      otazky(s).forEach(q=>{
        if(q.typ==='frek'||q.typ==='anone'){if(!zodpovezeno(q))odpovedi[q.id]='ne';}
        else if(q.typ==='matice'){const m={};const cur=odpovedi[q.id]||{};
          Object.keys(cur).forEach(k=>m[k]=cur[k]);
          q.polozky.forEach(x=>{if(!m[x.id])m[x.id]='ne';});odpovedi[q.id]=m;}
        else if((q.typ==='vyber'||q.typ==='vicevyber')&&!zodpovezeno(q)){
          const n=q.volby.filter(o=>!o.t)[0];if(n)odpovedi[q.id]=q.typ==='vyber'?n.l:[n.l];}
      });
      uloz();render();
    };
    act.appendChild(b1);
    if(rezim==='kontrola'&&!s.vzdy&&s.otazky.some(q=>!q.s)){
      const b3=document.createElement('button');b3.className='btn';
      b3.textContent=rozsireno[s.id]?'Skrýt doplňkové otázky':'Doplnit celou sekci';
      b3.onclick=()=>{rozsireno[s.id]=!rozsireno[s.id];uloz();render();};
      act.appendChild(b3);
    }
    const b2=document.createElement('button');b2.className='btn';b2.textContent='Vymazat sekci';
    b2.onclick=()=>{otazky(s).forEach(q=>{delete odpovedi[q.id];delete poznamky[q.id];});uloz();render();};
    act.appendChild(b2);
    main.appendChild(act);
  }
  renderNav();updateProgress();
  document.getElementById('nextBtn').textContent=aktivni===list.length-1?'Hotovo':'Další';
}

function updateProgress(){
  const qq=sekce().filter(s=>!s.vystup&&!s.prubeh).reduce((a,s)=>a.concat(otazky(s)),[]);
  const done=qq.filter(zodpovezeno).length;
  document.getElementById('progressBar').style.width=(qq.length?done/qq.length*100:0)+'%';
  document.getElementById('countLabel').textContent=done+' / '+qq.length;
}

  const box=document.createElement('div');box.className='record';

    const e=document.createElement('p');e.className='empty';

  }else{
    const l=document.createElement('div');l.className='obraz';

      '</b><span>'+Object.keys(o.odpovedi||{}).length+' odpovědí</span></div>';});
    l.innerHTML=html;box.appendChild(l);
    const del=document.createElement('button');del.className='btn';del.style.marginTop='14px';
    del.textContent='Smazat poslední odběr';

    box.appendChild(del);
  }
  main.appendChild(box);

  if(historie.length){
    const tb=document.createElement('div');tb.className='record';
    tb.innerHTML='<h3>Posun elementů</h3>';
    const snim=historie.map((o,i)=>({d:czDatum(o.datum).replace(/ \d{4}$/,''),m:mrizka(obrazDo(i))}));
    if(Object.keys(odpovedi).length)snim.push({d:'dnes',m:mrizka(obrazAktualni())});
    const tab=document.createElement('table');tab.className='mrizka';
    let html='<tr><th>Element</th><th>osa</th>'+snim.map(x=>'<th>'+x.d+'</th>').join('')+'<th>posun</th></tr>';
    Object.keys(ELEMENTY).forEach(e=>{
      ['oslabeni','stagnace'].forEach((osa,idx)=>{
        const rada=snim.map(x=>{const el=x.m.elementy.filter(y=>y.e===e)[0];
          return el?el.b[osa].souhrn:null;});
        const pl=rada.filter(x=>x!==null);
        if(!pl.length||Math.max.apply(null,pl)<15)return;
        const prvni=pl[0],posl=pl[pl.length-1],d=posl-prvni;
        const sip=d<=-8?'<span class="down">▼ zlepšení '+Math.abs(d)+'</span>':
          (d>=8?'<span class="up">▲ zhoršení '+d+'</span>':'▬ beze změny');
        html+='<tr><td class="el">'+(idx===0?ELEMENTY[e].n:'')+'</td><td style="text-align:left">'+
          OSY[osa].n.toLowerCase()+'</td>'+
          rada.map(x=>'<td>'+(x===null?'—':x)+'</td>').join('')+'<td>'+sip+'</td></tr>';
      });
    });
    tab.innerHTML=html;tb.appendChild(tab);
    const leg=document.createElement('p');leg.className='disclaimer';
    leg.textContent='Počítá se vždy ze složeného obrazu, tedy z nejnovější známé hodnoty u každé položky. Řádky pod 15 body se nezobrazují.';
    tb.appendChild(leg);main.appendChild(tb);
  }

  const ob=document.createElement('div');ob.className='record';
  ob.innerHTML='<h3>Aktuální obraz a stáří nálezů</h3>';
  const o=obrazAktualni(),list=document.createElement('div');list.className='obraz';
  let html='',n=0;
  vsechnyOtazky().forEach(q=>{
    const z=o[q.id];if(!z)return;
    let v=z.v;
    if(q.typ==='bbc'){
      if(!Array.isArray(v)||!v.length)return;
      v=v.filter(x=>x&&x.n).map(x=>x.n+' '+x.v).join(', ');
    }
    else if(Array.isArray(v))v=v.join(', ');
    if(v&&typeof v==='object')return;
    if(v==='ne'||v==='')return;
    const dnu=stariDnu(z.datum);n++;
    html+='<div><b>'+q.zapis+': '+v+'</b><span class="'+(dnu>120?'stale':'')+'">'+
      (dnu<1?'dnes':czDatum(z.datum)+(dnu>120?', '+Math.round(dnu/30)+' měsíců':''))+'</span></div>';
  });
  if(!n){const e=document.createElement('p');e.className='empty';e.textContent='Zatím nic.';ob.appendChild(e);}
  else{list.innerHTML=html;ob.appendChild(list);}
  main.appendChild(ob);
}

function sekceText(id,obraz){
  const s=DOTAZNIK.filter(x=>x.id===id)[0];
  if(!s||(s.podminka&&!s.podminka(odpovedi)))return null;
  const poz=[],neg=[],radky=[];
  s.otazky.forEach(q=>{
    if(q.podminka&&!q.podminka(odpovedi))return;
    const zaz=obraz[q.id];if(!zaz)return;
    const v=zaz.v,stare=zaz.datum!==dnesnyDatum()?' ['+czDatum(zaz.datum)+']':'';
    const pozn=poznamky[q.id]?' ('+poznamky[q.id].trim()+')':'';
    if(q.typ==='frek'){if(v==='ne')neg.push(q.zapis);else if(v)poz.push(q.zapis+' — '+v+pozn+stare);return;}
    if(q.typ==='anone'){if(v==='ne')neg.push(q.zapis);else if(v==='ano')poz.push(q.zapis+pozn+stare);return;}
    if(q.typ==='matice'){
      if(!v||typeof v!=='object')return;
      const a=[],nn=[];
      q.polozky.forEach(p=>{const x=v[p.id];if(!x)return;x==='ne'?nn.push(p.l):a.push(p.l+' ('+x+')');});
      if(a.length)radky.push(q.zapis+': '+a.join(', ')+'.'+stare);
      if(nn.length)radky.push('Neguje: '+nn.join(', ')+'.');
      return;
    }
    if(q.typ==='bbc'){
      if(!Array.isArray(v)||!v.length)return;
      const r=v.filter(x=>x&&x.n).map(x=>x.n+' '+x.v);
      if(r.length)radky.push(q.zapis+': '+r.join(', ')+stare);
      return;
    }
    if(prazdna(v))return;
    if(q.typ==='skala')radky.push(q.zapis+': '+v+'/10'+pozn+stare);
    else if(q.typ==='skala6')radky.push(q.zapis+': '+v+'/6'+pozn+stare);
    else if(q.typ==='cislo')radky.push(q.zapis+': '+v+(q.jednotka?' '+q.jednotka:'')+pozn+
      (q.bmi&&bmiText()?', '+bmiText():'')+stare);
    else if(Array.isArray(v))radky.push(q.zapis+': '+v.join(', ')+pozn+stare);
    else radky.push(q.zapis+': '+String(v).trim()+pozn+stare);
  });
  if(poz.length)radky.push('Udává: '+poz.join(', ')+'.');
  if(neg.length)radky.push('Neguje: '+neg.join(', ')+'.');
  if(!radky.length)return null;
  return s.nazev+'\n'+radky.map(r=>'  '+r).join('\n');
}

function textZapisu(){
  const obraz=obrazAktualni(),L=[];
  L.push('ANAMNÉZA TČM — '+(rezim==='vstup'?'vstupní odběr':'kontrola č. '+(historie.length+1))+
    (odpovedi.klient?' — '+odpovedi.klient:'')+(klientId?' (ID '+klientId+')':''));
  L.push('Datum: '+czDatum(dnesnyDatum()));
  L.push('Údaje v hranatých závorkách pocházejí ze starších odběrů.');
  L.push('');
  const blok=(nadpis,ids)=>{
    let c=ids.map(i=>sekceText(i,obraz)).filter(Boolean);
    if(!c.length)return;
    if(c.length===1)c=[c[0].split('\n').slice(1).join('\n')];
    L.push(nadpis);L.push(c.join('\n'));L.push('');
  };
  blok('ZÁKLADNÍ ÚDAJE',['zaklad']);
  blok('SLEDOVANÉ POTÍŽE',['vysledek']);
  blok('OSOBNÍ ANAMNÉZA A ŽIVOTOSPRÁVA',['styl']);
  blok('SUBJEKTIVNĚ',['termo','bolesti','pohyb','traveni','spanek','smysly','dychani','kuze','gynuro','psychika']);
  blok('OBJEKTIVNĚ',['objektiv']);

  const m=mrizka(obraz);
  L.push('ROZBOR PĚTI ELEMENTŮ (0–100, vyšší = větší potřeba zásahu)');
  L.push('  Souhrn: '+souhrnText(m));
  L.push('  element     oslabení   stagnace   teplo/chlad   zdroje');
  m.elementy.forEach(x=>{
    const c=v=>(v===null?'—':String(v));
    const t=x.b.teplo.souhrn;
    L.push('  '+(ELEMENTY[x.e].n+'        ').slice(0,10)+
      ('    '+c(x.b.oslabeni.souhrn)).slice(-6)+
      ('       '+c(x.b.stagnace.souhrn)).slice(-11)+
      ('        '+(t===null?'—':(t>0?'+':'')+t)).slice(-14)+
      '   '+x.shoda);
  });
  const nes=m.elementy.filter(x=>x.rozptyl!==null&&x.rozptyl>30);
  if(nes.length)L.push('  Nesoulad zdrojů u: '+nes.map(x=>ELEMENTY[x.e].n).join(', ')+
    '. Doporučeno ověřit.');
  if(m.bbc.zateze.length)L.push('  Zátěže podle závažnosti: '+m.bbc.zateze.map(z=>z.n+' '+z.pct+'/100').join(', ')+'.');
  L.push('  Podklad z '+m.pocet+' hodnocených otázek a '+
    (m.bbc.oslabeni.length+m.bbc.stagnace.length)+' položek BBC.');
  L.push('');
  L.push('ZÁVĚR A PLÁN');
  L.push('  ');
  return L.join('\n');
}

    });
  }
  const nezar=[].concat(m.bbc.oslabeni,m.bbc.stagnace).filter(x=>!x.e);
  if(nezar.length){
    const w=document.createElement('p');w.className='disclaimer';
    w.textContent='Bez přiřazeného elementu, doplňte v sekci BBC: '+
      nezar.map(x=>x.n).filter((v,i,a)=>a.indexOf(v)===i).join(', ')+'.';
    pb.appendChild(w);
  }
  main.appendChild(pb);

  const act=document.createElement('div');act.className='sec-actions';
  const mk=(l,fn,cls)=>{const b=document.createElement('button');b.className='btn'+(cls||'');b.textContent=l;b.onclick=fn;return b;};
  act.appendChild(mk('Přegenerovat',()=>{document.getElementById('zapisText').value=textZapisu();}));
  act.appendChild(mk('Kopírovat',function(){
    const t=document.getElementById('zapisText').value;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>alert('Zápis zkopírován.'),()=>{
        document.getElementById('zapisText').select();document.execCommand('copy');});
    }else{document.getElementById('zapisText').select();document.execCommand('copy');}
  },' btn-primary'));
  act.appendChild(mk('Stáhnout .txt',()=>{
    const b=new Blob([document.getElementById('zapisText').value],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='anamneza-tcm-'+dnesnyDatum()+'.txt';a.click();
  }));
  act.appendChild(mk('Tisk / PDF',()=>window.print()));
  act.appendChild(mk('Uložit odběr a začít další',()=>{
    if(!Object.keys(odpovedi).length){alert('Není co uložit.');return;}
    if(!confirm('Uložit tento odběr do historie? Odpovědi se uzamknou a další odběr začne prázdný.'))return;
    historie.push({datum:dnesnyDatum(),rezim:rezim,
      odpovedi:JSON.parse(JSON.stringify(odpovedi)),poznamky:JSON.parse(JSON.stringify(poznamky))});
    ulozHist();
    odpovedi={};poznamky={};rozsireno={};rezim='kontrola';aktivni=0;uloz();render();window.scrollTo(0,0);
  }));
  main.appendChild(act);

  if(historie.length){
    const pr=document.createElement('div');pr.className='sec-actions';
    pr.appendChild(mk(rezim==='vstup'?'Přepnout na kontrolu':'Rozbalit plný dotazník',()=>{
      rezim=rezim==='vstup'?'kontrola':'vstup';uloz();render();}));
    main.appendChild(pr);
  }
}

document.getElementById('prevBtn').onclick=()=>{if(aktivni>0){aktivni--;render();window.scrollTo(0,0);}};
document.getElementById('nextBtn').onclick=()=>{if(aktivni<sekce().length-1){aktivni++;render();window.scrollTo(0,0);}};
document.getElementById('openSheet').onclick=()=>{document.getElementById('sheet').dataset.open='true';};
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.dataset.open='false';};
render();
</script>
</body>
</html>
