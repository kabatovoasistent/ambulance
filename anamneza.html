<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anamnéza TČM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EE; --surface:#FFFFFF; --ink:#1B2A24; --muted:#6C7C74;
  --line:#D4DED7; --jade:#2F6B57; --jade-soft:#DFEAE3; --clay:#9C5F35; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Inter Tight",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:"Newsreader",Georgia,serif;font-size:21px;margin:0 0 2px}
.brand-sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:9px 10px;border-radius:10px;font-size:14.5px}
.nav-item:hover{background:var(--paper)}
.nav-item[aria-current="true"]{background:var(--jade-soft);color:var(--jade);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.nav-item[data-done="true"] .dot{background:var(--jade)}

.main{padding:26px 30px 130px;max-width:780px}
.topbar{display:none}
h2.sec-title{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:27px;margin:0 0 4px}
.sec-hint{color:var(--muted);margin:0 0 22px;font-size:14.5px}

.q{padding:15px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q.detail{border-top:0;padding:6px 0 6px 14px;margin-left:2px;border-left:2px solid var(--jade-soft)}
.q-text{font-weight:500;margin:0 0 9px}
.q.detail .q-text{font-weight:400;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;font-size:15px;min-height:42px}
.chip:hover{border-color:var(--jade)}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff}
.chip.neg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}

.matice{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow-label{font-size:15px}
.mbtns{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.mbtns button{border:0;background:none;padding:7px 11px;font-size:13.5px;min-height:38px;white-space:nowrap}
.mbtns button + button{border-left:1px solid var(--line)}
.mbtns button[aria-pressed="true"]{background:var(--jade);color:#fff}
.mbtns button[data-v="ne"][aria-pressed="true"]{background:var(--ink)}

.scale{display:flex;align-items:center;gap:14px}
.scale input{flex:1;accent-color:var(--jade)}
.scale output{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px}
.num{display:flex;align-items:center;gap:9px}
.num input{width:110px;text-align:center;font-variant-numeric:tabular-nums}
.unit{color:var(--muted)}
.calc{color:var(--jade);font-size:14px;margin:8px 0 0}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);padding:11px 13px;font:inherit;resize:vertical}
.note-toggle{background:none;border:0;color:var(--muted);font-size:13.5px;padding:6px 0;text-decoration:underline}
.q-note{margin-top:8px}

.sec-actions{display:flex;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:10px 16px;min-height:44px;font-size:15px}
.btn:hover{border-color:var(--jade)}
.btn-primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn-primary:hover{background:#26584a}

.footbar{position:fixed;left:252px;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--line);padding:12px 30px;display:flex;gap:10px;align-items:center}
.progress{flex:1;height:6px;background:var(--paper);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);width:0;transition:width .25s}
.count{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}

.record{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.record h3{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:20px;margin:0 0 12px}
#zapisText{font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.65;
  min-height:460px;border:0;padding:0;background:none}
#zapisText:focus{outline:none}
.pattern{border-top:1px solid var(--line);padding:13px 0}
.pattern:first-of-type{border-top:0}
.pattern-head{display:flex;align-items:baseline;gap:10px}
.pattern-name{font-weight:600}
.pattern-score{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--paper);border-radius:99px;margin:7px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--clay)}
.why{color:var(--muted);font-size:14px;margin:0}
.disclaimer{color:var(--muted);font-size:13.5px;margin:14px 0 0}
.empty{color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;
    background:var(--surface);border-bottom:1px solid var(--line);padding:11px 16px}
  .topbar .brand{font-size:17px;margin:0}
  .sheet{position:fixed;inset:0;background:rgba(20,32,27,.35);z-index:20;display:none}
  .sheet[data-open="true"]{display:block}
  .sheet-inner{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
    border-radius:18px 18px 0 0;padding:16px 14px 26px;max-height:78vh;overflow:auto}
  .main{padding:18px 16px 116px}
  h2.sec-title{font-size:23px}
  .footbar{left:0;padding:10px 16px}
  .chip{font-size:15.5px;padding:11px 16px}
  .mrow{grid-template-columns:1fr;gap:6px}
  .mbtns{width:100%}
  .mbtns button{flex:1}
}
@media print{
  .rail,.footbar,.topbar,.sec-actions{display:none}
  body{background:#fff}
  .main{padding:0;max-width:none}
  .record{border:0;padding:0}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <p class="brand">Anamnéza TČM</p>
    <p class="brand-sub" id="klientInfo">Nový odběr</p>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div>
    <header class="topbar">
      <button class="btn" id="openSheet" style="padding:8px 12px;min-height:40px">Sekce</button>
      <p class="brand" id="topTitle">Anamnéza TČM</p>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="footbar">
  <button class="btn" id="prevBtn">Zpět</button>
  <div class="progress"><i id="progressBar"></i></div>
  <span class="count" id="countLabel"></span>
  <button class="btn btn-primary" id="nextBtn">Další</button>
</div>

<div class="sheet" id="sheet"><div class="sheet-inner"><nav class="nav" id="navMobile"></nav></div></div>

  xue_yu:{nazev:'Stáza krve',text:'Fixní bodavé bolesti, tmavé zbarvení, sraženiny.'},

 {id:'typ_navstevy',typ:'vyber',text:'Důvod návštěvy',zapis:'Důvod návštěvy',volby:[{l:'prevence'},{l:'konkrétní potíž'}]},

 {id:'spoustec',typ:'vicevyber',text:'Spouštěcí faktor',zapis:'Spouštěč',detail:1,podminka:a=>a.typ_navstevy==='konkrétní potíž',volby:[
   {l:'neznámý'},{l:'stres',t:{gan_qi_yu:2}},{l:'úraz',t:{xue_yu:2}},{l:'infekce'},{l:'prochlazení',t:{shen_yang_xu:1}},{l:'chyba ve stravě',t:{pi_qi_xu:1}},{l:'přepracování',t:{pi_qi_xu:2}}]},

/* ====================================================================
   STAV
   ==================================================================== */
const KEY='tcm_anamneza_v2';
let odpovedi={},poznamky={},aktivni=0;
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);odpovedi=d.odpovedi||{};poznamky=d.poznamky||{};}}catch(e){}
const klientId=new URLSearchParams(location.search).get('id')||'';
const klientJmeno=new URLSearchParams(location.search).get('jmeno')||'';
if(klientId||klientJmeno) document.getElementById('klientInfo').textContent=(klientJmeno||'Klient')+(klientId?' · '+klientId:'');

const uloz=()=>{try{localStorage.setItem(KEY,JSON.stringify({odpovedi,poznamky,ts:Date.now()}));}catch(e){}};
const sekce=()=>DOTAZNIK.filter(s=>!s.podminka||s.podminka(odpovedi));
const otazky=s=>s.otazky.filter(q=>!q.podminka||q.podminka(odpovedi));
function zodpovezeno(q){
  const v=odpovedi[q.id];
  if(q.typ==='matice') return !!(v&&Object.keys(v).length);
  if(v===undefined||v===null||v==='') return false;
  return Array.isArray(v)?v.length>0:true;
}

/* ====================================================================
   VYKRESLENÍ
   ==================================================================== */
function renderNav(){
  const list=sekce();
  ['nav','navMobile'].forEach(id=>{
    const el=document.getElementById(id);el.innerHTML='';
    list.forEach((s,i)=>{
      const b=document.createElement('button');
      b.className='nav-item';b.setAttribute('aria-current',i===aktivni);
      b.dataset.done=s.vystup?false:otazky(s).every(zodpovezeno);
      b.innerHTML='<span class="dot"></span>'+s.nazev;
      b.onclick=()=>{aktivni=i;document.getElementById('sheet').dataset.open='false';render();window.scrollTo(0,0);};
      el.appendChild(b);
    });
  });
}

function chipRow(q,volby,multi){
  const box=document.createElement('div');box.className='chips';
  volby.forEach(o=>{
    const b=document.createElement('button');b.className='chip'+(o.l==='ne'?' neg':'');b.textContent=o.l;
    const akt=multi?(odpovedi[q.id]||[]).includes(o.l):odpovedi[q.id]===o.l;
    b.setAttribute('aria-pressed',akt);
    b.onclick=()=>{
      if(multi){const c=odpovedi[q.id]||[];odpovedi[q.id]=c.includes(o.l)?c.filter(x=>x!==o.l):c.concat(o.l);}
      else odpovedi[q.id]=odpovedi[q.id]===o.l?'':o.l;
      uloz();render();
    };
    box.appendChild(b);
  });
  return box;
}

function renderOtazka(q){
  const w=document.createElement('div');w.className='q'+(q.detail?' detail':'');
  const t=document.createElement('p');t.className='q-text';t.textContent=q.text;w.appendChild(t);

  if(q.typ==='frek') w.appendChild(chipRow(q,FREK,false));
  if(q.typ==='anone') w.appendChild(chipRow(q,[{l:'ano'},{l:'ne'}],false));
  if(q.typ==='vyber') w.appendChild(chipRow(q,q.volby,false));
  if(q.typ==='vicevyber') w.appendChild(chipRow(q,q.volby,true));

  if(q.typ==='matice'){
    const box=document.createElement('div');box.className='matice';
    (odpovedi[q.id]===undefined)&&(odpovedi[q.id]={});
    q.polozky.forEach(p=>{
      const row=document.createElement('div');row.className='mrow';
      const lab=document.createElement('span');lab.className='mrow-label';lab.textContent=p.l;
      const bt=document.createElement('div');bt.className='mbtns';
      FREK.forEach(f=>{
        const b=document.createElement('button');b.dataset.v=f.l;b.textContent=f.l;
        b.setAttribute('aria-pressed',(odpovedi[q.id]||{})[p.id]===f.l);
        b.onclick=()=>{const m=Object.assign({},odpovedi[q.id]);m[p.id]=f.l;odpovedi[q.id]=m;uloz();render();};
        bt.appendChild(b);
      });
      row.append(lab,bt);box.appendChild(row);
    });
    w.appendChild(box);
  }

  if(q.typ==='skala'){
    const box=document.createElement('div');box.className='scale';
    const r=document.createElement('input');r.type='range';r.min=0;r.max=10;r.step=1;r.value=odpovedi[q.id]??0;
    const o=document.createElement('output');o.textContent=(odpovedi[q.id]??0)+' / 10';
    r.oninput=()=>o.textContent=r.value+' / 10';
    r.onchange=()=>{odpovedi[q.id]=Number(r.value);uloz();renderNav();updateProgress();};
    box.append(r,o);w.appendChild(box);
  }

  if(q.typ==='cislo'){
    const box=document.createElement('div');box.className='num';
    const i=document.createElement('input');i.type='number';i.inputMode='numeric';i.value=odpovedi[q.id]??'';
    i.oninput=()=>{odpovedi[q.id]=i.value===''?'':Number(i.value);uloz();
      if(q.bmi)bmiEl.textContent=bmiText();renderNav();updateProgress();};
    const u=document.createElement('span');u.className='unit';u.textContent=q.jednotka||'';
    box.append(i,u);w.appendChild(box);
    if(q.bmi){var bmiEl=document.createElement('p');bmiEl.className='calc';bmiEl.textContent=bmiText();w.appendChild(bmiEl);}
  }

  if(q.typ==='text'){
    const ta=document.createElement('textarea');ta.rows=2;ta.value=odpovedi[q.id]||'';
    ta.oninput=()=>{odpovedi[q.id]=ta.value;uloz();};
    ta.onblur=()=>{renderNav();updateProgress();};
    w.appendChild(ta);
  }

  if(q.typ!=='text'){
    const tog=document.createElement('button');tog.className='note-toggle';
    tog.textContent=poznamky[q.id]?'Poznámka':'Přidat poznámku';
    const nd=document.createElement('div');nd.className='q-note';
    nd.style.display=poznamky[q.id]?'block':'none';
    const ta=document.createElement('textarea');ta.rows=2;ta.value=poznamky[q.id]||'';
    ta.oninput=()=>{poznamky[q.id]=ta.value;uloz();};
    nd.appendChild(ta);
    tog.onclick=()=>{nd.style.display=nd.style.display==='none'?'block':'none';if(nd.style.display==='block')ta.focus();};
    w.append(tog,nd);
  }
  return w;
}

function bmiText(){
  const v=Number(odpovedi.vyska),k=Number(odpovedi.vaha);
  if(!v||!k) return '';
  const b=k/Math.pow(v/100,2);
  return 'BMI '+b.toFixed(1);
}

function render(){
  const list=sekce();
  if(aktivni>=list.length) aktivni=list.length-1;
  const s=list[aktivni],main=document.getElementById('main');
  main.innerHTML='';
  document.getElementById('topTitle').textContent=s.nazev;
  const h=document.createElement('h2');h.className='sec-title';h.textContent=s.nazev;
  const p=document.createElement('p');p.className='sec-hint';p.textContent=s.hint||'';
  main.append(h,p);

  if(s.vystup) renderZapis(main);
  else{
    otazky(s).forEach(q=>main.appendChild(renderOtazka(q)));
    const act=document.createElement('div');act.className='sec-actions';
    const b1=document.createElement('button');b1.className='btn';b1.textContent='Sekce bez potíží';
    b1.onclick=()=>{
      otazky(s).forEach(q=>{
        if(q.typ==='frek'||q.typ==='anone'){ if(!zodpovezeno(q)) odpovedi[q.id]='ne'; }
        else if(q.typ==='matice'){const m=Object.assign({},odpovedi[q.id]);q.polozky.forEach(x=>{if(!m[x.id])m[x.id]='ne';});odpovedi[q.id]=m;}
        else if((q.typ==='vyber'||q.typ==='vicevyber')&&!zodpovezeno(q)){
          const n=q.volby.find(o=>!o.t);
          if(n) odpovedi[q.id]=q.typ==='vyber'?n.l:[n.l];
        }
      });
      uloz();render();
    };
    const b2=document.createElement('button');b2.className='btn';b2.textContent='Vymazat sekci';
    b2.onclick=()=>{otazky(s).forEach(q=>{delete odpovedi[q.id];delete poznamky[q.id];});uloz();render();};
    act.append(b1,b2);main.appendChild(act);
  }
  renderNav();updateProgress();
  document.getElementById('nextBtn').textContent=aktivni===list.length-1?'Hotovo':'Další';
}

function updateProgress(){
  const qs=sekce().filter(s=>!s.vystup).flatMap(otazky);
  const done=qs.filter(zodpovezeno).length;
  document.getElementById('progressBar').style.width=(qs.length?done/qs.length*100:0)+'%';
  document.getElementById('countLabel').textContent=done+' / '+qs.length;
}

/* ====================================================================
   SYNDROMOVÉ SKÓRE
   ==================================================================== */
function skore(){
  const sc={},proc={};
  Object.keys(VZORCE).forEach(k=>{sc[k]=0;proc[k]=[];});
  const pridej=(t,popis,nasobek)=>{
    if(!t) return;
    Object.entries(t).forEach(([k,w])=>{
      if(sc[k]===undefined) return;
      const v=w*(nasobek===undefined?1:nasobek);
      if(v<=0) return;
      sc[k]+=v;proc[k].push(popis);
    });
  };
  sekce().forEach(s=>otazky(s).forEach(q=>{
    const v=odpovedi[q.id];
    if(q.typ==='frek'&&v&&v!=='ne'){const f=FREK.find(x=>x.l===v);pridej(q.t,q.zapis+' ('+v+')',f?f.w:1);}
    if(q.typ==='anone'&&v==='ano') pridej(q.t,q.zapis,1);
    if(q.typ==='vyber'&&v){const o=q.volby.find(x=>x.l===v);if(o)pridej(o.t,q.zapis.toLowerCase()+': '+o.l,1);}
    if(q.typ==='vicevyber'&&Array.isArray(v)) v.forEach(l=>{const o=q.volby.find(x=>x.l===l);if(o)pridej(o.t,q.zapis.toLowerCase()+': '+o.l,1);});
    if(q.typ==='matice'&&v) Object.entries(v).forEach(([pid,val])=>{
      if(val==='ne') return;const p=q.polozky.find(x=>x.id===pid),f=FREK.find(x=>x.l===val);
      if(p)pridej(p.t,p.l+' ('+val+')',f?f.w:1);
    });
  }));
  return Object.entries(sc).map(([k,v])=>({k,v:Math.round(v*10)/10,proc:proc[k]}))
    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
}

/* ====================================================================
   ZÁPIS
   ==================================================================== */
function sekceText(id){
  const s=DOTAZNIK.find(x=>x.id===id);
  if(!s||(s.podminka&&!s.podminka(odpovedi))) return null;
  const poz=[],neg=[],radky=[];
  otazky(s).forEach(q=>{
    const v=odpovedi[q.id],pozn=poznamky[q.id]?' ('+poznamky[q.id].trim()+')':'';
    if(q.typ==='frek'){ if(v==='ne')neg.push(q.zapis); else if(v)poz.push(q.zapis+' — '+v+pozn); return; }
    if(q.typ==='anone'){ if(v==='ne')neg.push(q.zapis); else if(v==='ano')poz.push(q.zapis+pozn); return; }
    if(q.typ==='matice'){
      if(!v) return;
      const a=[],n=[];
      q.polozky.forEach(p=>{const x=v[p.id];if(!x)return;x==='ne'?n.push(p.l):a.push(p.l+' ('+x+')');});
      if(a.length)radky.push(q.zapis+': '+a.join(', ')+'.');
      if(n.length)radky.push('Neguje: '+n.join(', ')+'.');
      return;
    }
    if(v===undefined||v===''||(Array.isArray(v)&&!v.length)) return;
    if(q.typ==='skala') radky.push(q.zapis+': '+v+'/10'+pozn);
    else if(q.typ==='cislo') radky.push(q.zapis+': '+v+(q.jednotka?' '+q.jednotka:'')+pozn+(q.bmi&&bmiText()?', '+bmiText():''));
    else if(Array.isArray(v)) radky.push(q.zapis+': '+v.join(', ')+pozn);
    else radky.push(q.zapis+': '+String(v).trim()+pozn);
  });
  if(poz.length) radky.push('Udává: '+poz.join(', ')+'.');
  if(neg.length) radky.push('Neguje: '+neg.join(', ')+'.');
  if(!radky.length) return null;
  return s.nazev+'\n'+radky.map(r=>'  '+r).join('\n');
}

function textZapisu(){
  const L=[];
  L.push('ANAMNÉZA TČM'+(klientJmeno?' — '+klientJmeno:'')+(klientId?' (ID '+klientId+')':''));
  L.push('Datum odběru: '+new Date().toLocaleDateString('cs-CZ'));
  L.push('');
  const blok=(nadpis,ids)=>{
    let c=ids.map(sekceText).filter(Boolean);
    if(!c.length) return;
    if(c.length===1) c=[c[0].split('\n').slice(1).join('\n')];
    L.push(nadpis);L.push(c.join('\n'));L.push('');
  };
  blok('ZÁKLADNÍ ÚDAJE',['zaklad']);
  blok('OSOBNÍ ANAMNÉZA A ŽIVOTOSPRÁVA',['styl']);
  blok('SUBJEKTIVNĚ',['termo','bolesti','pohyb','traveni','spanek','smysly','dychani','kuze','gynuro','psychika']);
  blok('OBJEKTIVNĚ',['objektiv']);
  const sk=skore().slice(0,3);
  if(sk.length){
    L.push('NÁVRH SYNDROMU (podklad k ověření)');
    sk.forEach((x,i)=>{
      L.push('  '+(i+1)+'. '+VZORCE[x.k].nazev+' — skóre '+x.v);
      L.push('     Opora: '+[...new Set(x.proc)].join('; ')+'.');
    });
    L.push('');
  }
  L.push('ZÁVĚR A PLÁN');
  L.push('  ');
  return L.join('\n');
}

function renderZapis(main){
  const box=document.createElement('div');box.className='record';
  const h=document.createElement('h3');h.textContent='Anamnestický zápis';
  const ta=document.createElement('textarea');ta.id='zapisText';ta.value=textZapisu();
  box.append(h,ta);main.appendChild(box);

  const sk=skore();
  const pb=document.createElement('div');pb.className='record';pb.style.marginTop='16px';
  const ph=document.createElement('h3');ph.textContent='Návrh syndromu';pb.appendChild(ph);
  if(!sk.length){
    const e=document.createElement('p');e.className='empty';e.textContent='Zatím není dost odpovědí pro návrh.';pb.appendChild(e);
  }else{
    const max=sk[0].v;
    sk.slice(0,4).forEach(x=>{
      const d=document.createElement('div');d.className='pattern';
      d.innerHTML='<div class="pattern-head"><span class="pattern-name">'+VZORCE[x.k].nazev+
        '</span><span class="pattern-score">skóre '+x.v+'</span></div>'+
        '<div class="bar"><i style="width:'+(x.v/max*100)+'%"></i></div>'+
        '<p class="why">'+VZORCE[x.k].text+' Opora: '+[...new Set(x.proc)].join('; ')+'.</p>';
      pb.appendChild(d);
    });
    const dis=document.createElement('p');dis.className='disclaimer';
    dis.textContent='Skóre je součet vah odpovědí, kde „výjimečně" váží čtvrtinu a „často" plnou hodnotu. Podklad, ne diagnóza.';
    pb.appendChild(dis);
  }
  main.appendChild(pb);

  const act=document.createElement('div');act.className='sec-actions';
  const mk=(l,fn,cls)=>{const b=document.createElement('button');b.className='btn'+(cls||'');b.textContent=l;b.onclick=fn;return b;};
  act.append(
    mk('Přegenerovat z odpovědí',()=>{document.getElementById('zapisText').value=textZapisu();}),
    mk('Kopírovat',async()=>{
      const t=document.getElementById('zapisText').value;
      try{await navigator.clipboard.writeText(t);alert('Zápis zkopírován.');}
      catch(e){document.getElementById('zapisText').select();document.execCommand('copy');}
    },' btn-primary'),
    mk('Stáhnout .txt',()=>{
      const b=new Blob([document.getElementById('zapisText').value],{type:'text/plain;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download='anamneza-tcm-'+new Date().toISOString().slice(0,10)+'.txt';a.click();
    }),
    mk('Tisk / PDF',()=>window.print()),
    mk('Nový odběr',()=>{
      if(!confirm('Smazat všechny odpovědi a začít nový odběr?'))return;
      odpovedi={};poznamky={};aktivni=0;uloz();render();window.scrollTo(0,0);
    })
  );
  main.appendChild(act);
}

document.getElementById('prevBtn').onclick=()=>{if(aktivni>0){aktivni--;render();window.scrollTo(0,0);}};
document.getElementById('nextBtn').onclick=()=>{if(aktivni<sekce().length-1){aktivni++;render();window.scrollTo(0,0);}};
document.getElementById('openSheet').onclick=()=>document.getElementById('sheet').dataset.open='true';
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.dataset.open='false';};

render();
</script>
