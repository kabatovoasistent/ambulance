<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Karta pacienta — ukončeno</title>
<style>
  :root {
    --bg: #f4f6f5;
    --karta: #ffffff;
    --text: #1d2b25;
    --text-2: #5b6b63;
    --zelena: #2f6b4f;
    --cara: #dfe6e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17;
      --karta: #1c2420;
      --text: #e8efeb;
      --text-2: #9db0a6;
      --zelena: #6aa585;
      --cara: #2a3630;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .karta {
    max-width: 460px;
    width: 100%;
    background: var(--karta);
    border: 1px solid var(--cara);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .znak {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border-radius: 12px;
    background: var(--zelena);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .znak svg { width: 24px; height: 24px; }
  h1 {
    margin: 0 0 12px;
    font-size: 1.25rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0 0 14px;
    color: var(--text-2);
  }
  p:last-child { margin-bottom: 0; }
  .patka {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--cara);
    font-size: 0.8125rem;
    color: var(--text-2);
  }
</style>
</head>
<body>
  <main class="karta">
    <div class="znak" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="2"></rect>
        <path d="M8 2v4M16 2v4M3 10h18"></path>
      </svg>
    </div>

    <h1>Karta pacienta</h1>

    <p>Tato verze aplikace byla ukončena a už není v provozu.</p>
    <p>Ambulantní agenda přešla na nový systém. Pokud sis tuto stránku uložil/a do záložek, odkaz prosím odstraň — data zadaná zde by se nikam neuložila.</p>

    <p class="patka">Stránka je bez funkce. Provozní dotazy řeš přímo v ordinaci.</p>
  </main>
</body>
</html>
